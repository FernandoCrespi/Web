<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>2 - CSS</title>
<style>

    /* Regra CSS:(utilizando de exemplo o botão abaixo)
        seletor: botao

    */
    button{
        background-color: blue;
        color: white;
        padding: 10px;
        
    }
    button:hover{background-color: red;animation: aumenta 2s;}
    p::before{content: "🚀";}
    @keyframes aumenta {
        from{}
        to{transform: scale(1.5);}
        
    }
</style>

</head>
<body>
    <h1>Estrutura e Sintaxe de CSS</h1>

    <p>Uma regra de CSS é usada para estilizar elementos HTML.
       Ela possui: 
    </p>

    <ul>
        <li>Seletor: define o elemento(button)</li>
        <li>Propriedades: define o que mudar(background-color)</li>
        <li>Valor: define o valor da propriedade(blue)</li>
    </ul>
    <h3>Exemplo</h3>
    <p>button{ background-color: blue; }</p>

    <button>Botão</button>
</body>
</html>
