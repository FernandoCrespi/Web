<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>4c - Position</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: lightcoral;
            position: relative;
        }

        .foguete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
        }
    </style>
</head>
<body>

    <div class="foguete">🚀</div>

</body>
</html>
